services:
  app:
    build: .
    container_name: api-gateway
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    environment: 
      - TZ=Asia/Manila
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm run db:migration-up && npm run db:seed && npm run dev"

  db:
    image: postgres:18
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-app_db}
      TZ: Asia/Manila
      PGTZ: Asia/Manila
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-app_db}"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  pg_data: